
<div class="input-group rounded" >
  <input style="margin-left:80%" id="datatable_filter" type="search" class="form-control rounded" [formControl]="filter"
         value="filter" placeholder="Search"
  />
  <span class="input-group-text border-0" id="search-addon" >
    <i class="fas fa-search"></i>
  </span>
</div>


<table class="table" >
  <thead class="thead-light">
  <tr>
    <th scope="row">ID</th>
    <th scope="row">Value</th>
    <th scope="row">Hour</th>
    <th scope="row">Actions</th>
  </tr>
  </thead>
  <tbody>
  <tr *ngFor="let prices of price">
    <td>{{prices.id}}</td>
    <td>{{prices.value}}</td>
    <td>{{prices.hour}}</td>
    <th><span  type="button" class="material-icons edit"
               (click)="onEdit(prices)">
      edit
    </span>
      <span type="button" class="material-icons delete" (click)="onDelete(prices)">
        delete
      </span></th>
  </tr>
  </tbody>
</table>



<div>
  <button mat-mini-fab class="add"><span class="material-symbols-outlined" (click)="onSubmit()">add</span></button>
</div>
