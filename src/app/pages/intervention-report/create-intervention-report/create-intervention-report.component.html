<div class="card" style="margin-top: 50px; width: 800px; margin-left: 250px">
  <div role="document">
    <div class="card-content">
      <div class="card-header">
        <h3 class="card-title"><strong>Relatório de Intervenção</strong></h3>
      </div>
      <div class="card-body" [formGroup]="formInterventionReport">
        <div class="mb-3">
          <label class="form-label">Pedido de Intervenção</label>
          <select class="select form-control" formControlName="interventionRequestId">
            <option *ngFor="let request of interventionRequest" [value]="request.id">
              {{request.interventionReason}}
            </option>
          </select>
        </div>
        <div class="mb-3">
          <div>
            <label class="form-label">Actividades realizadas</label>
            <div formArrayName="activitiesPerformed">
              <div *ngFor="let activitiesPerformed of activitiesPerformedGroup.controls; let i = index">
                <textarea type="text" class="form-control mb-2"  formControlName="{{i}}"></textarea>
              </div>
            </div>
          </div>
        </div>
        <div class="row">
          <div class="col-lg-8">

          </div>


          <div class="row gx-3 mb-3">
            <div class="col-md-3">
              <label class="form-label">Início</label>
              <input type="datetime-local" class="form-control" formControlName="startTime">
            </div>
            <div class="col-md-3">
              <div class="mb-3">
                <label class="form-label">Fim</label>
                <input type="datetime-local" class="form-control" formControlName="endTime">
              </div>
            </div>
            <div class="col-md-3">
              <div class="mb-3">
                <label class="form-label">Pausa</label>
                <input type="number" class="form-control" formControlName="breakTime">
              </div>
            </div>
            <div class="col-md-3">
              <label class="form-label">Modo de Intervenção</label>
              <select class="select form-control" formControlName="interventionModeId">
                <option *ngFor="let mode of interventionMode" [value]="mode.id">
                  {{mode.mode}}
                </option>
              </select>
            </div>
            <div class="mb-3">
              <div>
                <label class="form-label">Actividades Pendentes</label>
                <div formArrayName="pendingActivities">
                  <div *ngFor="let pendingActivities of pendingActivitiesGroup.controls; let i = index">
                    <textarea type="text" class="form-control mb-2"  formControlName="{{i}}"></textarea>
                  </div>
                </div>
              </div>
            </div>

            <div class="col-md-3">
              <div class="mb-3">
                <label class="form-label">Desconto</label>
                <input style="margin-left: 10px" type="checkbox" class="form-check-input" formControlName="discount">
              </div>

            </div>
            <div class="col-md-9">
              <div class="mb-3">
                <label class="form-label">Motivo do desconto</label>
                <input type="text" class="form-control" formControlName="discountReason">
              </div>
            </div>

          </div>
          <div class="modal-footer">
            <button href="#" class="btn btn-link link-secondary" data-bs-dismiss="modal">
              Cancel
            </button>
            <button  class="btn btn-primary ms-auto" (click)="onCreate()">

              <svg xmlns="http://www.w3.org/2000/svg" class="icon" width="24" height="24" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" fill="none" stroke-linecap="round" stroke-linejoin="round"><path stroke="none" d="M0 0h24v24H0z" fill="none"/><path d="M12 5l0 14" /><path d="M5 12l14 0" /></svg>
              Criar
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
